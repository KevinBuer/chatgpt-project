<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>坦克大战飞机</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at 20% 20%, #162134, #090d1a 60%);
      color: #e8f0ff;
      font-family: "Segoe UI", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #frame {
      position: relative;
      width: 520px;
      height: 780px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: radial-gradient(circle at 50% -20%, rgba(68, 107, 154, 0.08), rgba(12, 18, 34, 0.5)),
        linear-gradient(#0c1222 0%, #0c1222 70%, #0b1a2e 100%);
    }

    #hud {
      position: absolute;
      top: 12px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      z-index: 2;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
    }

    #legend {
      line-height: 1.6;
    }

    #hud strong {
      color: #7dd6ff;
    }

    #game {
      display: block;
      width: 100%;
      height: 100%;
      background: #03060f;
      cursor: crosshair;
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(8, 12, 24, 0.85), rgba(8, 12, 24, 0.9));
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      text-align: center;
      transition: opacity 160ms ease;
      z-index: 3;
    }

    #overlay.hidden {
      pointer-events: none;
      opacity: 0;
    }

    button {
      background: linear-gradient(135deg, #36b37e, #2e8d63);
      border: none;
      color: #f0f8ff;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.4);
    }

    button:active {
      transform: translateY(1px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body>
  <div id="frame">
    <div id="hud">
      <div id="legend">
        按键：<strong>← →</strong> 移动 ｜ <strong>空格</strong> 开火
      </div>
      <div>
        分数：<strong id="score">0</strong> ｜ 生命：<strong id="lives">3</strong>
      </div>
    </div>
    <canvas id="game" width="520" height="780"></canvas>
    <div id="overlay">
      <h1>坦克大战飞机</h1>
      <p>真实模型、可爱的水果补给，射击来袭飞机与坦克！</p>
      <button id="start">开始游戏</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start');

    const world = {
      width: canvas.width,
      height: canvas.height,
      running: false,
      lastTime: 0,
      score: 0,
      lives: 3,
    };

    const tank = {
      x: canvas.width / 2,
      y: canvas.height - 80,
      width: 76,
      height: 32,
      speed: 320,
      cooldown: 240,
      lastShot: 0,
    };

    const bullets = [];
    const effects = [];
    const threats = [];
    const keys = { left: false, right: false, space: false };
    let spawnTimer = 0;

    document.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft') keys.left = true;
      if (e.code === 'ArrowRight') keys.right = true;
      if (e.code === 'Space') keys.space = true;
    });

    document.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft') keys.left = false;
      if (e.code === 'ArrowRight') keys.right = false;
      if (e.code === 'Space') keys.space = false;
    });

    startBtn.addEventListener('click', startGame);

    function startGame() {
      world.running = true;
      world.score = 0;
      world.lives = 3;
      tank.x = canvas.width / 2;
      bullets.length = 0;
      threats.length = 0;
      world.lastTime = performance.now();
      spawnTimer = 0;
      updateHud();
      overlay.classList.add('hidden');
      overlay.querySelector('h1').textContent = '坦克大战飞机';
      overlay.querySelector('p').textContent = '真实模型、可爱的水果补给，射击来袭飞机与坦克！';
      startBtn.textContent = '开始游戏';
      requestAnimationFrame(loop);
    }

    function updateHud() {
      scoreEl.textContent = world.score;
      livesEl.textContent = world.lives;
    }

    function spawnThreat() {
      const roll = Math.random();
      const size = 42 + Math.random() * 20;
      const x = Math.random() * (world.width - size - 24) + 12;
      const sway = (Math.random() * 2 - 1) * 70;
      const common = { x, y: -size, size, sway, offset: Math.random() * Math.PI * 2 };

      if (roll > 0.82) {
        threats.push({ ...common, type: 'fruit', speedY: 55 + Math.random() * 35, hp: 1 });
      } else if (roll > 0.62) {
        threats.push({ ...common, type: 'tank', speedY: 70 + Math.random() * 35, hp: 2 });
      } else {
        const speedY = 70 + Math.random() * 70 + world.score * 0.65;
        threats.push({ ...common, type: 'plane', speedY, hp: 1 });
      }
    }

    function shoot(timestamp) {
      if (timestamp - tank.lastShot < tank.cooldown) return;
      tank.lastShot = timestamp;
      bullets.push({ x: tank.x, y: tank.y - 10, speed: 540 });
      spawnBurst(tank.x, tank.y - 16, '#ffdd88', 4, 0.4);
    }

    function update(delta, timestamp) {
      const move = tank.speed * delta;
      if (keys.left) tank.x -= move;
      if (keys.right) tank.x += move;
      tank.x = Math.max(tank.width / 2 + 10, Math.min(world.width - tank.width / 2 - 10, tank.x));
      if (keys.space) shoot(timestamp);

      bullets.forEach((b) => (b.y -= b.speed * delta));
      for (let i = bullets.length - 1; i >= 0; i--) {
        if (bullets[i].y < -20) bullets.splice(i, 1);
      }

      spawnTimer += delta;
      if (spawnTimer > 0.85) {
        spawnThreat();
        spawnTimer = 0;
      }

      threats.forEach((p) => {
        p.y += p.speedY * delta;
        p.x += Math.sin(timestamp / 700 + p.offset) * p.sway * delta;
      });
      for (let i = threats.length - 1; i >= 0; i--) {
        if (threats[i].y > world.height + threats[i].size) {
          if (threats[i].type !== 'fruit') loseLife();
          threats.splice(i, 1);
        }
      }

      effects.forEach((e) => {
        e.x += e.vx * delta;
        e.y += e.vy * delta;
        e.life -= delta;
      });
      for (let i = effects.length - 1; i >= 0; i--) {
        if (effects[i].life <= 0) effects.splice(i, 1);
      }

      checkCollision();
    }

    function loseLife() {
      if (world.lives <= 0) return;
      world.lives -= 1;
      updateHud();
      if (world.lives <= 0) endGame();
    }

    function checkCollision() {
      for (let i = threats.length - 1; i >= 0; i--) {
        const p = threats[i];
        const px1 = p.x;
        const px2 = p.x + p.size;
        const py1 = p.y;
        const py2 = p.y + p.size * 0.75;

        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          const bx1 = b.x - 2.5;
          const bx2 = b.x + 2.5;
          const by1 = b.y - 16;
          const by2 = b.y + 2;

          if (bx1 < px2 && bx2 > px1 && by1 < py2 && by2 > py1) {
            bullets.splice(j, 1);
            p.hp -= 1;
            if (p.hp <= 0) {
              if (p.type === 'fruit') {
                world.score += 2;
                if (world.lives < 5) world.lives += 1;
                spawnBurst(p.x + p.size / 2, p.y + p.size * 0.2, '#ffb347', 8, 0.9);
              } else if (p.type === 'tank') {
                world.score += 2;
                spawnBurst(p.x + p.size / 2, p.y + p.size * 0.3, '#f0ddc2', 12, 1.1);
              } else {
                world.score += 1;
                spawnBurst(p.x + p.size / 2, p.y + p.size * 0.2, '#9cd2ff', 10, 0.8);
              }
              threats.splice(i, 1);
              updateHud();
            }
            break;
          }
        }

        const tankBox = {
          x1: tank.x - tank.width / 2,
          x2: tank.x + tank.width / 2,
          y1: tank.y - tank.height,
          y2: tank.y + 8,
        };

        if (tankBox.x1 < px2 && tankBox.x2 > px1 && tankBox.y1 < py2 && tankBox.y2 > py1) {
          threats.splice(i, 1);
          if (p.type === 'fruit') {
            world.score += 2;
            if (world.lives < 5) world.lives += 1;
            updateHud();
          } else {
            loseLife();
            spawnBurst(tank.x, tank.y - 18, '#ff8b74', 14, 1.2);
          }
        }
      }
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, 0, world.height);
      gradient.addColorStop(0, '#0d1b2e');
      gradient.addColorStop(1, '#050914');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, world.width, world.height);

      ctx.save();
      ctx.globalAlpha = 0.28;
      ctx.fillStyle = '#1a2d44';
      for (let i = 0; i < 26; i++) {
        const x = (world.width / 26) * i + 4;
        ctx.fillRect(x, 0, 2, world.height);
      }
      ctx.restore();

      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.beginPath();
      ctx.ellipse(world.width / 2, world.height * 0.2, 120, 28, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(world.width / 3, world.height * 0.35, 80, 20, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(world.width * 0.75, world.height * 0.45, 90, 24, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#0e1928';
      ctx.fillRect(0, world.height - 100, world.width, 110);
      const runwayGrad = ctx.createLinearGradient(0, world.height - 92, 0, world.height - 12);
      runwayGrad.addColorStop(0, '#121e31');
      runwayGrad.addColorStop(1, '#0b111e');
      ctx.fillStyle = runwayGrad;
      ctx.fillRect(0, world.height - 92, world.width, 86);

      ctx.fillStyle = '#1c2f46';
      for (let i = 0; i < world.width; i += 46) {
        ctx.fillRect(i + 10, world.height - 84, 18, 74);
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.setLineDash([9, 10]);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, world.height - 46);
      ctx.lineTo(world.width, world.height - 46);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#f7c86c';
      for (let i = 10; i < world.width; i += 58) {
        ctx.beginPath();
        ctx.arc(i + 12, world.height - 18, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawTank() {
      ctx.save();
      ctx.translate(tank.x, tank.y);

      ctx.fillStyle = '#1f2e1f';
      ctx.fillRect(-tank.width / 2, -tank.height / 2, tank.width, tank.height + 10);
      ctx.fillStyle = '#2f4930';
      for (let i = -tank.width / 2 + 6; i < tank.width / 2; i += 16) {
        ctx.fillRect(i, tank.height / 2 - 4, 12, 10);
      }

      const bodyGrad = ctx.createLinearGradient(0, -tank.height, 0, tank.height / 2);
      bodyGrad.addColorStop(0, '#3f6b3f');
      bodyGrad.addColorStop(1, '#2f4d2f');
      ctx.fillStyle = bodyGrad;
      ctx.fillRect(-tank.width / 2 + 6, -tank.height, tank.width - 12, tank.height);
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.strokeRect(-tank.width / 2 + 6, -tank.height, tank.width - 12, tank.height);

      ctx.fillStyle = '#d4d49a';
      ctx.fillRect(-6, -tank.height - 10, 12, 22);
      ctx.fillStyle = '#c0c081';
      ctx.fillRect(-3, -tank.height - 22, 6, 12);

      ctx.fillStyle = '#4c7a4c';
      ctx.beginPath();
      ctx.arc(0, -tank.height / 2, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#203520';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, -tank.height / 2, 14, Math.PI * 0.25, Math.PI * 0.75);
      ctx.stroke();

      ctx.restore();
    }

    function drawBullets() {
      bullets.forEach((b) => {
        const grad = ctx.createLinearGradient(b.x, b.y - 16, b.x, b.y + 6);
        grad.addColorStop(0, '#ffe27a');
        grad.addColorStop(1, '#ff9f43');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(b.x - 3, b.y - 16, 6, 18, 3);
        ctx.fill();
        ctx.fillStyle = '#fff6d5';
        ctx.fillRect(b.x - 1.5, b.y - 18, 3, 4);
      });
    }

    function drawEffects() {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      effects.forEach((e) => {
        const alpha = Math.max(0, e.life / e.maxLife);
        const r = e.size * alpha;
        const grad = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, r);
        grad.addColorStop(0, e.color);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }

    function drawPlane(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      const bodyGrad = ctx.createLinearGradient(0, 0, 0, p.size);
      bodyGrad.addColorStop(0, '#8ec5ff');
      bodyGrad.addColorStop(1, '#2a5d91');
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.roundRect(p.size * 0.2, 0, p.size * 0.6, p.size * 0.75, 10);
      ctx.fill();

      ctx.fillStyle = '#d0e8ff';
      ctx.fillRect(p.size * 0.35, p.size * 0.1, p.size * 0.3, p.size * 0.2);

      ctx.fillStyle = '#4b95d1';
      ctx.beginPath();
      ctx.moveTo(0, p.size * 0.35);
      ctx.lineTo(p.size, p.size * 0.2);
      ctx.lineTo(p.size, p.size * 0.5);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#d7f0ff';
      ctx.beginPath();
      ctx.moveTo(p.size * 0.5, p.size * 0.75);
      ctx.lineTo(p.size * 0.65, p.size);
      ctx.lineTo(p.size * 0.35, p.size);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#b7c7d9';
      ctx.beginPath();
      ctx.arc(p.size * 0.5, p.size * 0.05, p.size * 0.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawEnemyTank(p) {
      ctx.save();
      ctx.translate(p.x + p.size / 2, p.y + p.size * 0.45);
      const baseWidth = p.size * 0.9;
      const baseHeight = p.size * 0.35;

      const treadGrad = ctx.createLinearGradient(-baseWidth / 2, 0, baseWidth / 2, 0);
      treadGrad.addColorStop(0, '#353535');
      treadGrad.addColorStop(1, '#151515');
      ctx.fillStyle = treadGrad;
      ctx.fillRect(-baseWidth / 2, baseHeight * 0.4, baseWidth, baseHeight * 0.8);
      ctx.fillStyle = '#222';
      for (let i = -baseWidth / 2 + 6; i < baseWidth / 2; i += 12) {
        ctx.fillRect(i, baseHeight * 0.55, 8, baseHeight * 0.3);
      }

      const hullGrad = ctx.createLinearGradient(0, -baseHeight, 0, baseHeight);
      hullGrad.addColorStop(0, '#7f5d3a');
      hullGrad.addColorStop(1, '#5a3f29');
      ctx.fillStyle = hullGrad;
      ctx.roundRect(-baseWidth / 2 + 6, -baseHeight * 0.2, baseWidth - 12, baseHeight * 1.1, 8);
      ctx.fill();

      ctx.fillStyle = '#c7b08a';
      ctx.fillRect(-4, -baseHeight * 0.7, 8, baseHeight * 1.4);
      ctx.fillStyle = '#d8c08d';
      ctx.fillRect(-2, -baseHeight * 1.3, 4, baseHeight * 0.6);

      ctx.fillStyle = '#967c52';
      ctx.beginPath();
      ctx.arc(0, -baseHeight * 0.2, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawFruit(p) {
      ctx.save();
      ctx.translate(p.x + p.size / 2, p.y + p.size * 0.4);
      const r = p.size * 0.24;
      const bodyGrad = ctx.createRadialGradient(-r * 0.2, -r * 0.2, r * 0.3, 0, 0, r * 1.4);
      bodyGrad.addColorStop(0, '#ffefab');
      bodyGrad.addColorStop(1, '#f07b3d');
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.arc(0, 0, r * 1.3, Math.PI * 0.1, Math.PI * 1.9);
      ctx.fill();

      ctx.strokeStyle = '#d95b2c';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-r * 0.8, -r * 0.2);
      ctx.quadraticCurveTo(-r * 0.2, -r * 0.8, r * 0.8, -r * 0.2);
      ctx.stroke();

      ctx.fillStyle = '#55a74a';
      ctx.beginPath();
      ctx.moveTo(0, -r * 1.4);
      ctx.quadraticCurveTo(r * 0.6, -r * 1.8, r * 1.2, -r * 1.2);
      ctx.quadraticCurveTo(r * 0.4, -r * 1.1, 0, -r * 1.4);
      ctx.fill();
      ctx.restore();
    }

    function drawThreats() {
      threats.forEach((p) => {
        if (p.type === 'plane') drawPlane(p);
        else if (p.type === 'tank') drawEnemyTank(p);
        else drawFruit(p);
      });
    }

    function draw() {
      drawBackground();
      drawTank();
      drawBullets();
      drawEffects();
      drawThreats();
    }

    function loop(timestamp) {
      if (!world.running) return;
      const delta = Math.min(0.04, (timestamp - world.lastTime) / 1000);
      world.lastTime = timestamp;
      update(delta, timestamp);
      draw();
      requestAnimationFrame(loop);
    }

    function endGame() {
      world.running = false;
      overlay.classList.remove('hidden');
      overlay.querySelector('h1').textContent = '游戏结束';
      overlay.querySelector('p').textContent = `最终得分：${world.score}`;
      startBtn.textContent = '再来一局';
    }

    function spawnBurst(x, y, color, count = 8, strength = 0.8) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = (Math.random() * 80 + 70) * strength;
        effects.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 16 + Math.random() * 10,
          color,
          life: 0.5 + Math.random() * 0.35,
          maxLife: 0.5 + Math.random() * 0.35,
        });
      }
    }

    draw();
  </script>
</body>
</html>
