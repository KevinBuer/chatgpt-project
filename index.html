<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>飞机突袭交通线</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at 18% 22%, #1c2536, #0a0f1c 55%);
      color: #e7f0ff;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #frame {
      position: relative;
      width: 560px;
      height: 820px;
      border-radius: 18px;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(36, 47, 66, 0.7), rgba(11, 16, 25, 0.95)),
        radial-gradient(circle at 30% 20%, rgba(95, 118, 151, 0.28), rgba(18, 26, 43, 0.8));
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.55), inset 0 0 0 2px rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      z-index: 2;
      pointer-events: none;
    }

    #legend {
      font-size: 13px;
      line-height: 1.5;
      color: #cbd6e7;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
    }

    #panel {
      display: flex;
      gap: 10px;
      align-items: center;
      background: linear-gradient(145deg, rgba(32, 45, 62, 0.85), rgba(13, 21, 34, 0.92));
      padding: 8px 12px;
      border-radius: 10px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), inset 0 -1px 0 rgba(0, 0, 0, 0.4), 0 8px 18px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 13px;
      background: linear-gradient(135deg, rgba(69, 99, 132, 0.95), rgba(37, 56, 79, 0.9));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), inset 0 -1px 0 rgba(0, 0, 0, 0.35);
      color: #f4fbff;
      text-shadow: 0 0 6px rgba(0, 0, 0, 0.45);
    }

    .pill strong {
      color: #9fe7ff;
      letter-spacing: 0.4px;
    }

    #game {
      display: block;
      width: 100%;
      height: 100%;
      background: #050a13;
      cursor: crosshair;
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, rgba(36, 54, 82, 0.18), rgba(5, 8, 15, 0.92));
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
      text-align: center;
      transition: opacity 160ms ease;
      z-index: 3;
      color: #e9f4ff;
    }

    #overlay.hidden {
      pointer-events: none;
      opacity: 0;
    }

    #overlay h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: 1px;
      text-shadow: 0 6px 20px rgba(0, 0, 0, 0.65);
    }

    #overlay p {
      margin: 0;
      line-height: 1.6;
      color: #d5e0f3;
    }

    button {
      background: linear-gradient(135deg, #2c9f6b, #1f7c54);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #f2fbff;
      padding: 11px 24px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.44), inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    button:active {
      transform: translateY(1px);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.36), inset 0 0 0 rgba(255, 255, 255, 0.18);
    }
  </style>
</head>
<body>
  <div id="frame">
    <div id="hud">
      <div id="legend">
        按键：<strong>← →</strong> 侧移 ｜ <strong>↑ ↓</strong> 前进/后退 ｜ <strong>空格</strong> 开火 ｜ 防线：红色刻度线
      </div>
      <div id="panel">
        <span class="pill">分数 <strong id="score">0</strong></span>
        <span class="pill">金币 <strong id="coins">0</strong></span>
        <span class="pill">生命 <strong id="lives">3</strong></span>
        <span class="pill">火力 <strong id="power">1</strong></span>
      </div>
    </div>
    <canvas id="game" width="560" height="820"></canvas>
    <div id="overlay" data-state="start">
      <h1>飞机突袭交通线</h1>
      <p>驾驶美军前线攻击机，守住补给线，摧毁前方载具与伪装补给。</p>
      <button id="start">起飞</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const coinsEl = document.getElementById('coins');
    const livesEl = document.getElementById('lives');
    const powerEl = document.getElementById('power');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start');

    const world = {
      width: canvas.width,
      height: canvas.height,
      running: false,
      lastTime: 0,
      score: 0,
      coins: 0,
      lives: 3,
      revives: 0,
      failureReason: '',
    };

    const plane = {
      x: canvas.width / 2,
      y: canvas.height - 140,
      width: 82,
      height: 86,
      speedX: 360,
      speedY: 280,
      baseCooldown: 220,
      lastShot: 0,
    };

    const defenseLine = world.height - 90;

    const bullets = [];
    const effects = [];
    const threats = [];
    const keys = { left: false, right: false, up: false, down: false, space: false };
    let spawnTimer = 0;

    document.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft') keys.left = true;
      if (e.code === 'ArrowRight') keys.right = true;
      if (e.code === 'ArrowUp') keys.up = true;
      if (e.code === 'ArrowDown') keys.down = true;
      if (e.code === 'Space') keys.space = true;
    });

    document.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft') keys.left = false;
      if (e.code === 'ArrowRight') keys.right = false;
      if (e.code === 'ArrowUp') keys.up = false;
      if (e.code === 'ArrowDown') keys.down = false;
      if (e.code === 'Space') keys.space = false;
    });

    startBtn.addEventListener('click', () => {
      const mode = overlay.dataset.state;
      if (mode === 'revive' && world.coins >= reviveCost()) {
        reviveGame();
      } else {
        startGame();
      }
    });

    function startGame() {
      world.running = true;
      world.score = 0;
      world.coins = 0;
      world.lives = 3;
      world.revives = 0;
      plane.x = canvas.width / 2;
      plane.y = canvas.height - 140;
      bullets.length = 0;
      threats.length = 0;
      effects.length = 0;
      world.lastTime = performance.now();
      spawnTimer = 0;
      updateHud();
      overlay.classList.add('hidden');
      overlay.dataset.state = 'start';
      overlay.querySelector('h1').textContent = '飞机突袭交通线';
      overlay.querySelector('p').textContent = '驾驶美军前线攻击机，守住补给线，摧毁前方载具与伪装补给。';
      startBtn.textContent = '起飞';
      requestAnimationFrame(loop);
    }

    function reviveCost() {
      return Math.round(14 * Math.pow(1.6, world.revives));
    }

    function reviveGame() {
      const cost = reviveCost();
      world.coins -= cost;
      world.revives += 1;
      world.lives = 3;
      bullets.length = 0;
      threats.length = 0;
      effects.length = 0;
      plane.x = canvas.width / 2;
      plane.y = canvas.height - 140;
      world.running = true;
      world.lastTime = performance.now();
      updateHud();
      overlay.classList.add('hidden');
      overlay.dataset.state = 'start';
      requestAnimationFrame(loop);
    }

    function updateHud() {
      scoreEl.textContent = world.score;
      coinsEl.textContent = world.coins;
      livesEl.textContent = world.lives;
      powerEl.textContent = firepowerLevel();
    }

    function spawnThreat() {
      const roll = Math.random();
      const level = firepowerLevel();
      const bulk = 1 + (level - 1) * 0.18 + Math.min(0.3, world.score * 0.003);
      const baseSize = 48 + Math.random() * 22;
      const size = baseSize * bulk;
      const x = Math.random() * (world.width - size - 28) + 14;
      const sway = (Math.random() * 2 - 1) * 55;
      const toughness = Math.max(0, level - 1) + Math.floor(world.score / 50);
      const common = { x, y: -size, size, sway, offset: Math.random() * Math.PI * 2 };

      if (roll > 0.8) {
        threats.push({ ...common, type: 'fruit', speedY: 65 + Math.random() * 35, hp: 1 + Math.floor(toughness / 2) });
      } else if (roll > 0.55) {
        threats.push({ ...common, type: 'jeep', speedY: 90 + Math.random() * 60 + world.score * 0.25, hp: 1 + toughness });
      } else if (roll > 0.3) {
        threats.push({ ...common, type: 'tank', speedY: 70 + Math.random() * 40 + world.score * 0.2, hp: 2 + toughness });
      } else {
        threats.push({ ...common, type: 'boat', speedY: 65 + Math.random() * 35 + world.score * 0.22, hp: 1 + toughness });
      }
    }

    function firepowerLevel() {
      if (world.score >= 120) return 3;
      if (world.score >= 50) return 2;
      return 1;
    }

    function shoot(timestamp) {
      const level = firepowerLevel();
      const cooldown = Math.max(120, plane.baseCooldown - (level - 1) * 60);
      if (timestamp - plane.lastShot < cooldown) return;
      plane.lastShot = timestamp;

      const offsets = level === 1 ? [0] : level === 2 ? [-12, 12] : [-16, 0, 16];
      offsets.forEach((ox, idx) => {
        const spread = level === 3 && idx !== 1 ? 80 : 0;
        bullets.push({ x: plane.x + ox, y: plane.y - 20, speed: 660 + level * 30, vx: spread === 0 ? 0 : ox > 0 ? spread : -spread });
      });
      spawnBurst(plane.x, plane.y - 18, '#ffd77a', 4 + level * 2, 0.55 + level * 0.12);
    }

    function update(delta, timestamp) {
      const moveX = plane.speedX * delta;
      const moveY = plane.speedY * delta;
      if (keys.left) plane.x -= moveX;
      if (keys.right) plane.x += moveX;
      if (keys.up) plane.y -= moveY;
      if (keys.down) plane.y += moveY;
      plane.x = Math.max(plane.width / 2 + 16, Math.min(world.width - plane.width / 2 - 16, plane.x));
      plane.y = Math.max(110, Math.min(world.height - 110, plane.y));
      if (keys.space) shoot(timestamp);

      bullets.forEach((b) => {
        b.y -= b.speed * delta;
        if (b.vx) b.x += b.vx * delta;
      });
      for (let i = bullets.length - 1; i >= 0; i--) {
        if (bullets[i].y < -20 || bullets[i].x < -30 || bullets[i].x > world.width + 30) bullets.splice(i, 1);
      }

      spawnTimer += delta;
      if (spawnTimer > 0.85) {
        spawnThreat();
        spawnTimer = 0;
      }

      threats.forEach((p) => {
        p.y += p.speedY * delta;
        p.x += Math.sin(timestamp / 720 + p.offset) * p.sway * delta;
      });
      for (let i = threats.length - 1; i >= 0; i--) {
        if (threats[i].type !== 'fruit' && threats[i].y + threats[i].size * 0.75 > defenseLine) {
          breachDefense(threats[i]);
          threats.splice(i, 1);
          continue;
        }
        if (threats[i].y > world.height + threats[i].size) {
          if (threats[i].type !== 'fruit') loseLife('被漏过的目标导致机体受损');
          threats.splice(i, 1);
        }
      }

      effects.forEach((e) => {
        e.x += e.vx * delta;
        e.y += e.vy * delta;
        e.life -= delta;
      });
      for (let i = effects.length - 1; i >= 0; i--) {
        if (effects[i].life <= 0) effects.splice(i, 1);
      }

      checkCollision();
    }

    function loseLife(reason = '机体受损') {
      if (world.lives <= 0) return;
      world.lives -= 1;
      updateHud();
      if (world.lives <= 0) {
        world.failureReason = reason;
        endGame(true);
      }
    }

    function breachDefense(threat) {
      world.failureReason = '防线被 ' + describeThreat(threat.type) + ' 突破';
      endGame(true);
    }

    function describeThreat(type) {
      if (type === 'jeep') return '吉普车';
      if (type === 'tank') return '重型坦克';
      if (type === 'boat') return '快艇';
      return '伪装补给';
    }

    function checkCollision() {
      for (let i = threats.length - 1; i >= 0; i--) {
        const p = threats[i];
        const px1 = p.x;
        const px2 = p.x + p.size;
        const py1 = p.y;
        const py2 = p.y + p.size * 0.8;

        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          const bx1 = b.x - 2.5;
          const bx2 = b.x + 2.5;
          const by1 = b.y - 16;
          const by2 = b.y + 2;

          if (bx1 < px2 && bx2 > px1 && by1 < py2 && by2 > py1) {
            bullets.splice(j, 1);
            p.hp -= 1;
            spawnBurst(b.x, b.y, '#ffd48a', 5, 0.6);
            if (p.hp <= 0) {
              grantReward(p);
              threats.splice(i, 1);
              updateHud();
            }
            break;
          }
        }

        const planeBox = {
          x1: plane.x - plane.width / 2,
          x2: plane.x + plane.width / 2,
          y1: plane.y - plane.height / 2,
          y2: plane.y + plane.height / 2,
        };

        if (planeBox.x1 < px2 && planeBox.x2 > px1 && planeBox.y1 < py2 && planeBox.y2 > py1) {
          threats.splice(i, 1);
          if (p.type === 'fruit') {
            world.score += 3;
            world.coins += 3;
            if (world.lives < 5) world.lives += 1;
            spawnBurst(p.x + p.size / 2, p.y + p.size * 0.25, '#ffb347', 10, 1);
            updateHud();
          } else {
            loseLife('机体遭撞击');
            spawnBurst(plane.x, plane.y - 18, '#ff8b74', 14, 1.2);
          }
        }
      }
    }

    function grantReward(p) {
      if (p.type === 'fruit') {
        world.score += 3;
        world.coins += 3;
        if (world.lives < 5) world.lives += 1;
        spawnBurst(p.x + p.size / 2, p.y + p.size * 0.2, '#ffb347', 10, 1);
      } else if (p.type === 'tank') {
        world.score += 4;
        world.coins += 4;
        spawnBurst(p.x + p.size / 2, p.y + p.size * 0.32, '#f0ddc2', 14, 1.2);
      } else if (p.type === 'boat') {
        world.score += 2;
        world.coins += 2;
        spawnBurst(p.x + p.size / 2, p.y + p.size * 0.26, '#8ad0ff', 12, 1);
      } else {
        world.score += 2;
        world.coins += 2;
        spawnBurst(p.x + p.size / 2, p.y + p.size * 0.3, '#c8d6cf', 12, 0.9);
      }
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, 0, world.height);
      gradient.addColorStop(0, '#0f1c2d');
      gradient.addColorStop(1, '#060911');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, world.width, world.height);

      ctx.save();
      ctx.globalAlpha = 0.2;
      ctx.fillStyle = '#213145';
      for (let i = 0; i < 18; i++) {
        const x = (world.width / 18) * i + 6;
        ctx.fillRect(x, 0, 2, world.height);
      }
      ctx.restore();

      ctx.fillStyle = 'rgba(255,255,255,0.05)';
      ctx.beginPath();
      ctx.ellipse(world.width / 2, world.height * 0.22, 140, 32, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(world.width / 3, world.height * 0.35, 90, 22, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(world.width * 0.75, world.height * 0.46, 110, 26, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#0e1928';
      ctx.fillRect(0, world.height - 110, world.width, 120);
      const runwayGrad = ctx.createLinearGradient(0, world.height - 102, 0, world.height - 12);
      runwayGrad.addColorStop(0, '#1b2d45');
      runwayGrad.addColorStop(1, '#0b111d');
      ctx.fillStyle = runwayGrad;
      ctx.fillRect(0, world.height - 102, world.width, 96);

      ctx.fillStyle = '#30445f';
      for (let i = 0; i < world.width; i += 48) {
        ctx.fillRect(i + 12, world.height - 94, 18, 82);
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.setLineDash([9, 10]);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, world.height - 52);
      ctx.lineTo(world.width, world.height - 52);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.strokeStyle = '#c85555';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, defenseLine);
      ctx.lineTo(world.width, defenseLine);
      ctx.stroke();

      ctx.fillStyle = '#f6c76c';
      for (let i = 10; i < world.width; i += 62) {
        ctx.beginPath();
        ctx.arc(i + 12, world.height - 18, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawPlayerPlane() {
      ctx.save();
      ctx.translate(plane.x, plane.y);
      ctx.shadowColor = 'rgba(0,0,0,0.4)';
      ctx.shadowBlur = 16;

      const fuselageGrad = ctx.createLinearGradient(0, -plane.height / 2, 0, plane.height / 2);
      fuselageGrad.addColorStop(0, '#dfe8f5');
      fuselageGrad.addColorStop(0.5, '#8ea6bf');
      fuselageGrad.addColorStop(1, '#4e6581');
      ctx.fillStyle = fuselageGrad;
      ctx.beginPath();
      ctx.roundRect(-plane.width * 0.22, -plane.height * 0.58, plane.width * 0.44, plane.height * 1.16, 14);
      ctx.fill();

      const wingGrad = ctx.createLinearGradient(-plane.width * 0.6, 0, plane.width * 0.6, 0);
      wingGrad.addColorStop(0, '#3c4f62');
      wingGrad.addColorStop(1, '#263649');
      ctx.fillStyle = wingGrad;
      ctx.beginPath();
      ctx.moveTo(-plane.width * 0.7, -plane.height * 0.05);
      ctx.lineTo(plane.width * 0.7, -plane.height * 0.18);
      ctx.lineTo(plane.width * 0.6, plane.height * 0.12);
      ctx.lineTo(-plane.width * 0.6, plane.height * 0.25);
      ctx.closePath();
      ctx.fill();

      const tailGrad = ctx.createLinearGradient(0, plane.height * 0.1, 0, plane.height * 0.7);
      tailGrad.addColorStop(0, '#4c5f78');
      tailGrad.addColorStop(1, '#283547');
      ctx.fillStyle = tailGrad;
      ctx.beginPath();
      ctx.moveTo(-plane.width * 0.35, plane.height * 0.25);
      ctx.lineTo(plane.width * 0.35, plane.height * 0.12);
      ctx.lineTo(plane.width * 0.3, plane.height * 0.65);
      ctx.lineTo(-plane.width * 0.3, plane.height * 0.78);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#eff6ff';
      ctx.beginPath();
      ctx.roundRect(-plane.width * 0.18, -plane.height * 0.42, plane.width * 0.36, plane.height * 0.28, 8);
      ctx.fill();

      ctx.fillStyle = '#ff9b5a';
      ctx.beginPath();
      ctx.moveTo(0, -plane.height * 0.7);
      ctx.lineTo(-plane.width * 0.12, -plane.height * 0.48);
      ctx.lineTo(plane.width * 0.12, -plane.height * 0.48);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#ffd782';
      ctx.beginPath();
      ctx.arc(0, -plane.height * 0.72, plane.width * 0.08, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#b1c6dc';
      ctx.beginPath();
      ctx.arc(-plane.width * 0.35, plane.height * 0.02, plane.width * 0.08, 0, Math.PI * 2);
      ctx.arc(plane.width * 0.35, -plane.height * 0.06, plane.width * 0.08, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#f0f4ff';
      ctx.beginPath();
      ctx.arc(0, plane.height * 0.18, plane.width * 0.12, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawBullets() {
      bullets.forEach((b) => {
        const grad = ctx.createLinearGradient(b.x, b.y - 18, b.x, b.y + 6);
        grad.addColorStop(0, '#ffe27a');
        grad.addColorStop(1, '#ff9f43');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(b.x - 3, b.y - 18, 6, 18, 3);
        ctx.fill();
        ctx.fillStyle = '#fff6d5';
        ctx.fillRect(b.x - 1.5, b.y - 20, 3, 4);
      });
    }

    function drawEffects() {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      effects.forEach((e) => {
        const alpha = Math.max(0, e.life / e.maxLife);
        const r = e.size * alpha;
        const grad = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, r);
        grad.addColorStop(0, e.color);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }

    function drawJeep(p) {
      ctx.save();
      ctx.translate(p.x + p.size / 2, p.y + p.size * 0.45);
      const w = p.size * 0.92;
      const h = p.size * 0.36;

      ctx.fillStyle = '#131313';
      ctx.fillRect(-w / 2, h * 0.5, w, h * 0.55);
      ctx.fillStyle = '#2a2a2a';
      ctx.beginPath();
      ctx.arc(-w * 0.35, h * 1.05, h * 0.5, 0, Math.PI * 2);
      ctx.arc(w * 0.35, h * 1.05, h * 0.5, 0, Math.PI * 2);
      ctx.fill();

      const bodyGrad = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
      bodyGrad.addColorStop(0, '#6c7f5c');
      bodyGrad.addColorStop(1, '#405136');
      ctx.fillStyle = bodyGrad;
      ctx.roundRect(-w / 2, -h * 0.1, w, h * 1.1, 8);
      ctx.fill();

      ctx.fillStyle = '#d6dfc5';
      ctx.fillRect(-w * 0.35, -h * 0.05, w * 0.7, h * 0.35);
      ctx.restore();
    }

    function drawTank(p) {
      ctx.save();
      ctx.translate(p.x + p.size / 2, p.y + p.size * 0.48);
      const w = p.size * 1.02;
      const h = p.size * 0.4;

      const treadGrad = ctx.createLinearGradient(0, -h, 0, h * 1.6);
      treadGrad.addColorStop(0, '#1c1c1c');
      treadGrad.addColorStop(1, '#0f0f0f');
      ctx.fillStyle = treadGrad;
      ctx.beginPath();
      ctx.roundRect(-w * 0.58, h * 0.4, w * 1.16, h * 0.55, 10);
      ctx.fill();

      ctx.fillStyle = '#2f2f2f';
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.arc(i * w * 0.18, h * 0.95, h * 0.23, 0, Math.PI * 2);
        ctx.fill();
      }

      const hullGrad = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
      hullGrad.addColorStop(0, '#76856c');
      hullGrad.addColorStop(1, '#4b5a41');
      ctx.fillStyle = hullGrad;
      ctx.roundRect(-w / 2, -h * 0.2, w, h * 1.1, 10);
      ctx.fill();

      const turretGrad = ctx.createLinearGradient(0, -h, 0, h);
      turretGrad.addColorStop(0, '#8b9c7e');
      turretGrad.addColorStop(1, '#5c6a52');
      ctx.fillStyle = turretGrad;
      ctx.roundRect(-w * 0.18, -h * 0.35, w * 0.36, h * 0.85, 8);
      ctx.fill();

      ctx.fillStyle = '#c9d5c3';
      ctx.fillRect(-w * 0.06, -h * 0.65, w * 0.12, h * 1.15);
      ctx.restore();
    }

    function drawBoat(p) {
      ctx.save();
      ctx.translate(p.x + p.size / 2, p.y + p.size * 0.52);
      const w = p.size * 0.98;
      const h = p.size * 0.42;

      const hullGrad = ctx.createLinearGradient(0, -h, 0, h);
      hullGrad.addColorStop(0, '#4a7080');
      hullGrad.addColorStop(1, '#2d4c5a');
      ctx.fillStyle = hullGrad;
      ctx.beginPath();
      ctx.moveTo(-w / 2, -h * 0.1);
      ctx.lineTo(w / 2, -h * 0.35);
      ctx.lineTo(w * 0.45, h * 0.9);
      ctx.lineTo(-w * 0.45, h * 0.9);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#d8edf9';
      ctx.roundRect(-w * 0.25, -h * 0.55, w * 0.5, h * 0.6, 8);
      ctx.fill();

      ctx.fillStyle = '#83c4ff';
      ctx.fillRect(-w * 0.2, -h * 0.5, w * 0.4, h * 0.25);
      ctx.restore();
    }

    function drawFruit(p) {
      ctx.save();
      ctx.translate(p.x + p.size / 2, p.y + p.size * 0.42);
      const r = p.size * 0.28;
      const bodyGrad = ctx.createRadialGradient(-r * 0.2, -r * 0.2, r * 0.3, 0, 0, r * 1.4);
      bodyGrad.addColorStop(0, '#ffefab');
      bodyGrad.addColorStop(1, '#f07b3d');
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.arc(0, 0, r * 1.3, Math.PI * 0.1, Math.PI * 1.9);
      ctx.fill();

      ctx.strokeStyle = '#d95b2c';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-r * 0.8, -r * 0.2);
      ctx.quadraticCurveTo(-r * 0.2, -r * 0.8, r * 0.8, -r * 0.2);
      ctx.stroke();

      ctx.fillStyle = '#55a74a';
      ctx.beginPath();
      ctx.moveTo(0, -r * 1.4);
      ctx.quadraticCurveTo(r * 0.6, -r * 1.8, r * 1.2, -r * 1.2);
      ctx.quadraticCurveTo(r * 0.4, -r * 1.1, 0, -r * 1.4);
      ctx.fill();
      ctx.restore();
    }

    function drawThreats() {
      threats.forEach((p) => {
        if (p.type === 'jeep') drawJeep(p);
        else if (p.type === 'tank') drawTank(p);
        else if (p.type === 'boat') drawBoat(p);
        else drawFruit(p);
      });
    }

    function draw() {
      drawBackground();
      drawPlayerPlane();
      drawBullets();
      drawEffects();
      drawThreats();
    }

    function loop(timestamp) {
      if (!world.running) return;
      const delta = Math.min(0.04, (timestamp - world.lastTime) / 1000);
      world.lastTime = timestamp;
      update(delta, timestamp);
      draw();
      requestAnimationFrame(loop);
    }

    function endGame(allowRevive = true) {
      world.running = false;
      const cost = reviveCost();
      const canRevive = allowRevive && world.coins >= cost;
      overlay.classList.remove('hidden');
      overlay.dataset.state = canRevive ? 'revive' : 'start';
      overlay.querySelector('h1').textContent = world.failureReason || '防线失守';
      overlay.querySelector('p').innerHTML = canRevive
        ? `可消耗 <strong>${cost}</strong> 金币复活（当前 ${world.coins}）。`
        : `金币不足以复活（需要 ${cost}，当前 ${world.coins}），可重新起飞。`;
      startBtn.textContent = canRevive ? `消耗 ${cost} 金币复活` : '重新起飞';
    }

    function spawnBurst(x, y, color, count = 8, strength = 0.8) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = (Math.random() * 80 + 70) * strength;
        effects.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 16 + Math.random() * 10,
          color,
          life: 0.5 + Math.random() * 0.35,
          maxLife: 0.5 + Math.random() * 0.35,
        });
      }
    }

    draw();
  </script>
</body>
</html>
