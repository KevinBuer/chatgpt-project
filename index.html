<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>飞机突袭交通线</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at 20% 20%, #162134, #090d1a 60%);
      color: #e8f0ff;
      font-family: "Segoe UI", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #frame {
      position: relative;
      width: 520px;
      height: 780px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: radial-gradient(circle at 50% -20%, rgba(68, 107, 154, 0.08), rgba(12, 18, 34, 0.5)),
        linear-gradient(#0c1222 0%, #0c1222 70%, #0b1a2e 100%);
    }

    #hud {
      position: absolute;
      top: 12px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      z-index: 2;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
    }

    #legend {
      line-height: 1.6;
    }

    #hud strong {
      color: #7dd6ff;
    }

    #game {
      display: block;
      width: 100%;
      height: 100%;
      background: #03060f;
      cursor: crosshair;
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(8, 12, 24, 0.85), rgba(8, 12, 24, 0.9));
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      text-align: center;
      transition: opacity 160ms ease;
      z-index: 3;
    }

    #overlay.hidden {
      pointer-events: none;
      opacity: 0;
    }

    button {
      background: linear-gradient(135deg, #36b37e, #2e8d63);
      border: none;
      color: #f0f8ff;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.4);
    }

    button:active {
      transform: translateY(1px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body>
  <div id="frame">
    <div id="hud">
      <div id="legend">
        按键：<strong>← →</strong> 左右 ｜ <strong>↑ ↓</strong> 前进/后退 ｜ <strong>空格</strong> 开火
      </div>
      <div>
        分数：<strong id="score">0</strong> ｜ 生命：<strong id="lives">3</strong> ｜ 火力：<strong id="power">1</strong>
      </div>
    </div>
    <canvas id="game" width="520" height="780"></canvas>
    <div id="overlay">
      <h1>飞机突袭交通线</h1>
      <p>驾驶前线攻击机，扫射来袭的交通工具，摘取水果补给！</p>
      <button id="start">开始游戏</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const powerEl = document.getElementById('power');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start');

    const world = {
      width: canvas.width,
      height: canvas.height,
      running: false,
      lastTime: 0,
      score: 0,
      lives: 3,
    };

    const plane = {
      x: canvas.width / 2,
      y: canvas.height - 120,
      width: 68,
      height: 68,
      speedX: 330,
      speedY: 260,
      baseCooldown: 230,
      lastShot: 0,
    };

    const bullets = [];
    const effects = [];
    const threats = [];
    const keys = { left: false, right: false, up: false, down: false, space: false };
    let spawnTimer = 0;

    document.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft') keys.left = true;
      if (e.code === 'ArrowRight') keys.right = true;
      if (e.code === 'ArrowUp') keys.up = true;
      if (e.code === 'ArrowDown') keys.down = true;
      if (e.code === 'Space') keys.space = true;
    });

    document.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft') keys.left = false;
      if (e.code === 'ArrowRight') keys.right = false;
      if (e.code === 'ArrowUp') keys.up = false;
      if (e.code === 'ArrowDown') keys.down = false;
      if (e.code === 'Space') keys.space = false;
    });

    startBtn.addEventListener('click', startGame);

    function startGame() {
      world.running = true;
      world.score = 0;
      world.lives = 3;
      plane.x = canvas.width / 2;
      plane.y = canvas.height - 120;
      bullets.length = 0;
      threats.length = 0;
      world.lastTime = performance.now();
      spawnTimer = 0;
      updateHud();
      overlay.classList.add('hidden');
      overlay.querySelector('h1').textContent = '飞机突袭交通线';
      overlay.querySelector('p').textContent = '驾驶前线攻击机，扫射来袭的交通工具，摘取水果补给！';
      startBtn.textContent = '开始游戏';
      requestAnimationFrame(loop);
    }

    function updateHud() {
      scoreEl.textContent = world.score;
      livesEl.textContent = world.lives;
      powerEl.textContent = firepowerLevel();
    }

    function spawnThreat() {
      const roll = Math.random();
      const size = 46 + Math.random() * 22;
      const x = Math.random() * (world.width - size - 24) + 12;
      const sway = (Math.random() * 2 - 1) * 60;
      const common = { x, y: -size, size, sway, offset: Math.random() * Math.PI * 2 };

      if (roll > 0.8) {
        threats.push({ ...common, type: 'fruit', speedY: 55 + Math.random() * 35, hp: 1 });
      } else if (roll > 0.55) {
        threats.push({ ...common, type: 'jeep', speedY: 85 + Math.random() * 55 + world.score * 0.35, hp: 1 });
      } else if (roll > 0.3) {
        threats.push({ ...common, type: 'truck', speedY: 65 + Math.random() * 40 + world.score * 0.25, hp: 2 });
      } else {
        threats.push({ ...common, type: 'boat', speedY: 60 + Math.random() * 30 + world.score * 0.2, hp: 1 });
      }
    }

    function firepowerLevel() {
      if (world.score >= 60) return 3;
      if (world.score >= 25) return 2;
      return 1;
    }

    function shoot(timestamp) {
      const level = firepowerLevel();
      const cooldown = Math.max(120, plane.baseCooldown - (level - 1) * 55);
      if (timestamp - plane.lastShot < cooldown) return;
      plane.lastShot = timestamp;

      const offsets = level === 1 ? [0] : level === 2 ? [-10, 10] : [-14, 0, 14];
      offsets.forEach((ox, idx) => {
        const spread = level === 3 && idx !== 1 ? 80 : 0;
        bullets.push({ x: plane.x + ox, y: plane.y - 18, speed: 620 + level * 20, vx: spread === 0 ? 0 : ox > 0 ? spread : -spread });
      });
      spawnBurst(plane.x, plane.y - 16, '#ffdd88', 4 + level * 2, 0.5 + level * 0.1);
    }

    function update(delta, timestamp) {
      const moveX = plane.speedX * delta;
      const moveY = plane.speedY * delta;
      if (keys.left) plane.x -= moveX;
      if (keys.right) plane.x += moveX;
      if (keys.up) plane.y -= moveY;
      if (keys.down) plane.y += moveY;
      plane.x = Math.max(plane.width / 2 + 10, Math.min(world.width - plane.width / 2 - 10, plane.x));
      plane.y = Math.max(90, Math.min(world.height - 80, plane.y));
      if (keys.space) shoot(timestamp);

      bullets.forEach((b) => {
        b.y -= b.speed * delta;
        if (b.vx) b.x += b.vx * delta;
      });
      for (let i = bullets.length - 1; i >= 0; i--) {
        if (bullets[i].y < -20 || bullets[i].x < -30 || bullets[i].x > world.width + 30) bullets.splice(i, 1);
      }

      spawnTimer += delta;
      if (spawnTimer > 0.85) {
        spawnThreat();
        spawnTimer = 0;
      }

      threats.forEach((p) => {
        p.y += p.speedY * delta;
        p.x += Math.sin(timestamp / 700 + p.offset) * p.sway * delta;
      });
      for (let i = threats.length - 1; i >= 0; i--) {
        if (threats[i].y > world.height + threats[i].size) {
          if (threats[i].type !== 'fruit') loseLife();
          threats.splice(i, 1);
        }
      }

      effects.forEach((e) => {
        e.x += e.vx * delta;
        e.y += e.vy * delta;
        e.life -= delta;
      });
      for (let i = effects.length - 1; i >= 0; i--) {
        if (effects[i].life <= 0) effects.splice(i, 1);
      }

      checkCollision();
    }

    function loseLife() {
      if (world.lives <= 0) return;
      world.lives -= 1;
      updateHud();
      if (world.lives <= 0) endGame();
    }

    function checkCollision() {
      for (let i = threats.length - 1; i >= 0; i--) {
        const p = threats[i];
        const px1 = p.x;
        const px2 = p.x + p.size;
        const py1 = p.y;
        const py2 = p.y + p.size * 0.75;

        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          const bx1 = b.x - 2.5;
          const bx2 = b.x + 2.5;
          const by1 = b.y - 16;
          const by2 = b.y + 2;

          if (bx1 < px2 && bx2 > px1 && by1 < py2 && by2 > py1) {
            bullets.splice(j, 1);
            p.hp -= 1;
            if (p.hp <= 0) {
              if (p.type === 'fruit') {
                world.score += 2;
                if (world.lives < 5) world.lives += 1;
                spawnBurst(p.x + p.size / 2, p.y + p.size * 0.2, '#ffb347', 8, 0.9);
              } else if (p.type === 'truck') {
                world.score += 3;
                spawnBurst(p.x + p.size / 2, p.y + p.size * 0.3, '#f0ddc2', 12, 1.1);
              } else {
                world.score += 1;
                const color = p.type === 'boat' ? '#8ad0ff' : '#9cd2ff';
                spawnBurst(p.x + p.size / 2, p.y + p.size * 0.25, color, 10, 0.8);
              }
              threats.splice(i, 1);
              updateHud();
            }
            break;
          }
        }

        const planeBox = {
          x1: plane.x - plane.width / 2,
          x2: plane.x + plane.width / 2,
          y1: plane.y - plane.height / 2,
          y2: plane.y + plane.height / 2,
        };

        if (planeBox.x1 < px2 && planeBox.x2 > px1 && planeBox.y1 < py2 && planeBox.y2 > py1) {
          threats.splice(i, 1);
          if (p.type === 'fruit') {
            world.score += 2;
            if (world.lives < 5) world.lives += 1;
            updateHud();
          } else {
            loseLife();
            spawnBurst(plane.x, plane.y - 18, '#ff8b74', 14, 1.2);
          }
        }
      }
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, 0, world.height);
      gradient.addColorStop(0, '#0d1b2e');
      gradient.addColorStop(1, '#050914');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, world.width, world.height);

      ctx.save();
      ctx.globalAlpha = 0.28;
      ctx.fillStyle = '#1a2d44';
      for (let i = 0; i < 26; i++) {
        const x = (world.width / 26) * i + 4;
        ctx.fillRect(x, 0, 2, world.height);
      }
      ctx.restore();

      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.beginPath();
      ctx.ellipse(world.width / 2, world.height * 0.2, 120, 28, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(world.width / 3, world.height * 0.35, 80, 20, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(world.width * 0.75, world.height * 0.45, 90, 24, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#0e1928';
      ctx.fillRect(0, world.height - 100, world.width, 110);
      const runwayGrad = ctx.createLinearGradient(0, world.height - 92, 0, world.height - 12);
      runwayGrad.addColorStop(0, '#121e31');
      runwayGrad.addColorStop(1, '#0b111e');
      ctx.fillStyle = runwayGrad;
      ctx.fillRect(0, world.height - 92, world.width, 86);

      ctx.fillStyle = '#1c2f46';
      for (let i = 0; i < world.width; i += 46) {
        ctx.fillRect(i + 10, world.height - 84, 18, 74);
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.setLineDash([9, 10]);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, world.height - 46);
      ctx.lineTo(world.width, world.height - 46);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#f7c86c';
      for (let i = 10; i < world.width; i += 58) {
        ctx.beginPath();
        ctx.arc(i + 12, world.height - 18, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawPlayerPlane() {
      ctx.save();
      ctx.translate(plane.x, plane.y);
      ctx.shadowColor = 'rgba(0,0,0,0.35)';
      ctx.shadowBlur = 16;

      const bodyGrad = ctx.createLinearGradient(0, -plane.height / 2, 0, plane.height / 2);
      bodyGrad.addColorStop(0, '#d2e8ff');
      bodyGrad.addColorStop(1, '#5a7fb8');
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.roundRect(-plane.width * 0.22, -plane.height * 0.55, plane.width * 0.44, plane.height * 1.05, 12);
      ctx.fill();

      ctx.fillStyle = '#2c4f85';
      ctx.beginPath();
      ctx.moveTo(-plane.width * 0.65, -plane.height * 0.05);
      ctx.lineTo(plane.width * 0.65, -plane.height * 0.2);
      ctx.lineTo(plane.width * 0.65, plane.height * 0.05);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#3b5f9e';
      ctx.beginPath();
      ctx.moveTo(-plane.width * 0.55, plane.height * 0.35);
      ctx.lineTo(plane.width * 0.55, plane.height * 0.2);
      ctx.lineTo(plane.width * 0.48, plane.height * 0.5);
      ctx.lineTo(-plane.width * 0.48, plane.height * 0.65);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#f6f9ff';
      ctx.beginPath();
      ctx.roundRect(-plane.width * 0.16, -plane.height * 0.4, plane.width * 0.32, plane.height * 0.26, 6);
      ctx.fill();

      ctx.fillStyle = '#ff9b5a';
      ctx.beginPath();
      ctx.moveTo(0, -plane.height * 0.65);
      ctx.lineTo(-plane.width * 0.12, -plane.height * 0.45);
      ctx.lineTo(plane.width * 0.12, -plane.height * 0.45);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#ffd782';
      ctx.beginPath();
      ctx.arc(0, -plane.height * 0.7, plane.width * 0.08, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#c5d6f5';
      ctx.beginPath();
      ctx.arc(0, plane.height * 0.15, plane.width * 0.12, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawBullets() {
      bullets.forEach((b) => {
        const grad = ctx.createLinearGradient(b.x, b.y - 16, b.x, b.y + 6);
        grad.addColorStop(0, '#ffe27a');
        grad.addColorStop(1, '#ff9f43');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(b.x - 3, b.y - 16, 6, 18, 3);
        ctx.fill();
        ctx.fillStyle = '#fff6d5';
        ctx.fillRect(b.x - 1.5, b.y - 18, 3, 4);
      });
    }

    function drawEffects() {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      effects.forEach((e) => {
        const alpha = Math.max(0, e.life / e.maxLife);
        const r = e.size * alpha;
        const grad = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, r);
        grad.addColorStop(0, e.color);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }

    function drawJeep(p) {
      ctx.save();
      ctx.translate(p.x + p.size / 2, p.y + p.size * 0.45);
      const w = p.size * 0.9;
      const h = p.size * 0.35;

      ctx.fillStyle = '#121212';
      ctx.fillRect(-w / 2, h * 0.5, w, h * 0.5);
      ctx.fillStyle = '#2d2d2d';
      ctx.beginPath();
      ctx.arc(-w * 0.35, h * 1.05, h * 0.5, 0, Math.PI * 2);
      ctx.arc(w * 0.35, h * 1.05, h * 0.5, 0, Math.PI * 2);
      ctx.fill();

      const bodyGrad = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
      bodyGrad.addColorStop(0, '#6a8b52');
      bodyGrad.addColorStop(1, '#3f5f30');
      ctx.fillStyle = bodyGrad;
      ctx.roundRect(-w / 2, -h * 0.1, w, h * 1.1, 8);
      ctx.fill();

      ctx.fillStyle = '#d6dfc5';
      ctx.fillRect(-w * 0.35, -h * 0.05, w * 0.7, h * 0.35);
      ctx.restore();
    }

    function drawTruck(p) {
      ctx.save();
      ctx.translate(p.x + p.size / 2, p.y + p.size * 0.45);
      const w = p.size;
      const h = p.size * 0.38;

      ctx.fillStyle = '#101010';
      ctx.beginPath();
      ctx.arc(-w * 0.35, h * 1.05, h * 0.55, 0, Math.PI * 2);
      ctx.arc(w * 0.2, h * 1.05, h * 0.55, 0, Math.PI * 2);
      ctx.fill();

      const cabGrad = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
      cabGrad.addColorStop(0, '#9f4c3d');
      cabGrad.addColorStop(1, '#7c2f25');
      ctx.fillStyle = cabGrad;
      ctx.roundRect(-w / 2, -h * 0.1, w * 0.55, h * 1.1, 10);
      ctx.fill();

      const cargoGrad = ctx.createLinearGradient(0, -h, 0, h * 1.2);
      cargoGrad.addColorStop(0, '#c7c7c7');
      cargoGrad.addColorStop(1, '#8e8e8e');
      ctx.fillStyle = cargoGrad;
      ctx.roundRect(-w * 0.05, -h * 0.25, w * 0.55, h * 1.3, 6);
      ctx.fill();

      ctx.fillStyle = '#f2f2f2';
      ctx.fillRect(-w * 0.45, -h * 0.02, w * 0.2, h * 0.32);
      ctx.restore();
    }

    function drawBoat(p) {
      ctx.save();
      ctx.translate(p.x + p.size / 2, p.y + p.size * 0.5);
      const w = p.size * 0.95;
      const h = p.size * 0.4;

      const hullGrad = ctx.createLinearGradient(0, -h, 0, h);
      hullGrad.addColorStop(0, '#4a7080');
      hullGrad.addColorStop(1, '#2d4c5a');
      ctx.fillStyle = hullGrad;
      ctx.beginPath();
      ctx.moveTo(-w / 2, -h * 0.1);
      ctx.lineTo(w / 2, -h * 0.35);
      ctx.lineTo(w * 0.45, h * 0.9);
      ctx.lineTo(-w * 0.45, h * 0.9);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#d8edf9';
      ctx.roundRect(-w * 0.25, -h * 0.55, w * 0.5, h * 0.6, 8);
      ctx.fill();

      ctx.fillStyle = '#83c4ff';
      ctx.fillRect(-w * 0.2, -h * 0.5, w * 0.4, h * 0.25);
      ctx.restore();
    }

    function drawFruit(p) {
      ctx.save();
      ctx.translate(p.x + p.size / 2, p.y + p.size * 0.4);
      const r = p.size * 0.24;
      const bodyGrad = ctx.createRadialGradient(-r * 0.2, -r * 0.2, r * 0.3, 0, 0, r * 1.4);
      bodyGrad.addColorStop(0, '#ffefab');
      bodyGrad.addColorStop(1, '#f07b3d');
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.arc(0, 0, r * 1.3, Math.PI * 0.1, Math.PI * 1.9);
      ctx.fill();

      ctx.strokeStyle = '#d95b2c';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-r * 0.8, -r * 0.2);
      ctx.quadraticCurveTo(-r * 0.2, -r * 0.8, r * 0.8, -r * 0.2);
      ctx.stroke();

      ctx.fillStyle = '#55a74a';
      ctx.beginPath();
      ctx.moveTo(0, -r * 1.4);
      ctx.quadraticCurveTo(r * 0.6, -r * 1.8, r * 1.2, -r * 1.2);
      ctx.quadraticCurveTo(r * 0.4, -r * 1.1, 0, -r * 1.4);
      ctx.fill();
      ctx.restore();
    }

    function drawThreats() {
      threats.forEach((p) => {
        if (p.type === 'jeep') drawJeep(p);
        else if (p.type === 'truck') drawTruck(p);
        else if (p.type === 'boat') drawBoat(p);
        else drawFruit(p);
      });
    }

    function draw() {
      drawBackground();
      drawPlayerPlane();
      drawBullets();
      drawEffects();
      drawThreats();
    }

    function loop(timestamp) {
      if (!world.running) return;
      const delta = Math.min(0.04, (timestamp - world.lastTime) / 1000);
      world.lastTime = timestamp;
      update(delta, timestamp);
      draw();
      requestAnimationFrame(loop);
    }

    function endGame() {
      world.running = false;
      overlay.classList.remove('hidden');
      overlay.querySelector('h1').textContent = '游戏结束';
      overlay.querySelector('p').textContent = `最终得分：${world.score}`;
      startBtn.textContent = '再来一局';
    }

    function spawnBurst(x, y, color, count = 8, strength = 0.8) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = (Math.random() * 80 + 70) * strength;
        effects.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 16 + Math.random() * 10,
          color,
          life: 0.5 + Math.random() * 0.35,
          maxLife: 0.5 + Math.random() * 0.35,
        });
      }
    }

    draw();
